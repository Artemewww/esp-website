name: Promote a Vercel deployment to production

# Ручное переключение домена на конкретный деплой (откат/возврат).
# Срабатывает на push в ветку, когда меняется этот файл: адрес деплоя — в TARGET.
on:
  push:
    branches: [claude/upbeat-bohr-fq1vo9]
    paths: [.github/workflows/vercel-promote.yml]

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.ESP_TOK }}
      # Рабочий деплой заказчика от 24.09.2026
      TARGET: esp-websitetest-jdl1wyj38-artemewwws-projects.vercel.app
    steps:
      - run: npx --yes vercel@latest promote "$TARGET" --yes --token=$VERCEL_TOKEN --scope=artemewwws-projects
      - run: sleep 10; curl -sS -o /dev/null -w "home %{http_code}\n" https://esp-websitetest.vercel.app/
