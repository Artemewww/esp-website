name: Promote a Vercel deployment to production

# Ручное переключение домена на конкретный деплой (выпуск/откат).
# Срабатывает на push в ветку, когда меняется этот файл: деплой — в TARGET.
# После переключения проверяет сайт; если он не отвечает как надо —
# сразу возвращает прежний рабочий деплой (FALLBACK).
on:
  push:
    branches: [claude/upbeat-bohr-fq1vo9]
    paths: [.github/workflows/vercel-promote.yml]

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.ESP_TOK }}
      # Сборка Vercel (Git) ветки claude/upbeat-bohr-fq1vo9, коммит 5cc846d, 26.09.2026
      TARGET: dpl_GmpR7cJs3PTNnhz3wYpmfUec47zM
      # Рабочий деплой заказчика от 24.09.2026
      FALLBACK: esp-websitetest-jdl1wyj38-artemewwws-projects.vercel.app
    steps:
      # Promote уже запущен (новая production-сборка 9B3C5t2srox7vX2RJPQc2Krfufix).
      # Здесь только ждём переключения домена и проверяем сайт; при сбое — откат.
      - name: Wait for switch, check, roll back on failure
        run: |
          for i in $(seq 1 60); do
            curl -s https://esp-websitetest.vercel.app/ -o home.html -w "%{http_code}\n" > code.txt || true
            if grep -q "Наши проекты" home.html; then echo "new version is live"; break; fi
            if grep -q "NOT_FOUND" home.html || [ "$(cat code.txt)" -ge 500 ]; then echo "site broken"; break; fi
            sleep 10
          done
          ok=1
          for p in / /contacts /team /projects /about /equipment; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://esp-websitetest.vercel.app$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || ok=0
          done
          curl -s https://esp-websitetest.vercel.app/ -o home.html
          if grep -q "Наши проекты" home.html; then echo "NEW VERSION"; else echo "OLD VERSION still live"; fi
          if [ "$ok" != "1" ]; then
            echo "ROLLING BACK"
            npx --yes vercel@latest promote "$FALLBACK" --yes --token=$VERCEL_TOKEN --scope=artemewwws-projects
            exit 1
          fi
          echo "SITE OK"
