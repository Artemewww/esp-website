name: Inspect live site (read-only)

# Только чтение прода: снимок текста страниц, контента из админки и списка
# файлов текущего production-деплоя Vercel. Ничего не деплоит.
# Результат коммитится в отдельную ветку site-snapshot (перезапуск — любой правкой этого файла, напр. этой строки).
on:
  push:
    branches: [claude/upbeat-bohr-fq1vo9]
    paths: [.github/workflows/inspect-site.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.ESP_TOK }}
      TEAM: team_ufjxP44Wl5I0KjxOxgjLYDkf
      SITE: https://esp-websitetest.vercel.app
    steps:
      - name: Snapshot
        run: |
          mkdir -p snap/pages snap/content && cd snap
          api() { curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1&teamId=$TEAM"; }
          ID=$(api "/v4/aliases/esp-websitetest.vercel.app?" | python3 -c 'import sys,json;print(json.load(sys.stdin)["deploymentId"])')
          api "/v13/deployments/$ID?" > deployment.json
          api "/v6/deployments/$ID/files?" | python3 -c '
          import sys,json
          def flat(n,p):
              for c in n:
                  path=p+"/"+c["name"]
                  if c.get("type")=="directory": flat(c.get("children",[]),path)
                  else: print(c.get("uid"),path)
          flat(json.load(sys.stdin),"")' | sort -k2 > files.txt
          for k in articles certificates documents hero-slides news partners reviews team vacancies webinars; do
            curl -sS "$SITE/api/site-content/$k" > content/$k.json || true
          done
          curl -sS "$SITE/sitemap.xml" > sitemap.xml
          { grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//; s#^https\?://[^/]*##'; echo /; } | sort -u > paths.txt
          while read -r p; do
            f=pages/$(echo "${p#/}" | tr / _); [ "$p" = / ] && f=pages/index
            curl -sSL "$SITE$p" | python3 -c '
          import sys,re,html
          s=sys.stdin.read()
          t=re.search(r"<title>(.*?)</title>",s,re.S)
          print("TITLE:",html.unescape(t.group(1)).strip() if t else "-")
          s=re.sub(r"<(script|style|svg|noscript)[^>]*>.*?</\1>"," ",s,flags=re.S|re.I)
          s=re.sub(r"<[^>]+>","\n",s)
          prev=None
          for l in s.splitlines():
              l=html.unescape(l).strip()
              if l and l!=prev: print(l); prev=l' > "$f.txt"
          done < paths.txt

      - name: Commit snapshot to site-snapshot branch
        run: |
          cd snap
          git init -q -b site-snapshot
          git config user.name "site-snapshot"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Snapshot of $SITE at $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-snapshot
