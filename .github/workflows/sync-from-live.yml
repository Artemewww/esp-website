name: Sync repo from live deployment (read-only for site)

# Скачивает из текущего production-деплоя Vercel (esp-websitetest) исходники,
# которые отличаются от ветки или отсутствуют в ней, и коммитит их в эту же
# ветку. Сайт не трогает. Проверяет sha1 каждого файла.
on:
  push:
    branches: [claude/upbeat-bohr-fq1vo9]
    paths: [.github/workflows/sync-from-live.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.ESP_TOK }}
      TEAM: team_ufjxP44Wl5I0KjxOxgjLYDkf
    steps:
      - uses: actions/checkout@v4
      - name: Download changed files
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request, sys
          TOK=os.environ["VERCEL_TOKEN"]; TEAM=os.environ["TEAM"]
          def get(path, raw=False):
              sep = "&" if "?" in path else "?"
              req=urllib.request.Request(f"https://api.vercel.com{path}{sep}teamId={TEAM}",headers={"Authorization":f"Bearer {TOK}"})
              with urllib.request.urlopen(req, timeout=300) as r: return r.read() if raw else json.load(r)
          dep=get("/v4/aliases/esp-websitetest.vercel.app")["deploymentId"]
          print("live deployment", dep)
          tree=get(f"/v6/deployments/{dep}/files")
          files={}
          def walk(n,p):
              for c in n:
                  q=p+"/"+c["name"]
                  if c.get("type")=="directory": walk(c.get("children",[]),q)
                  elif q.startswith("/src/"): files[q[5:]]=c["uid"]
          walk(tree,"")
          SKIP=(".claude/", ".encode.log", "Документы_ESP_")
          changed=[]; failed=[]
          for p,uid in sorted(files.items()):
              if p.startswith(SKIP): continue
              if os.path.isfile(p) and hashlib.sha1(open(p,"rb").read()).hexdigest()==uid: continue
              body=None
              for v in ("v8","v7"):
                  try:
                      b=get(f"/{v}/deployments/{dep}/files/{uid}?path={urllib.parse.quote(p)}", raw=True)
                  except Exception as e:
                      last=e; continue
                  for cand in (b,):
                      if hashlib.sha1(cand).hexdigest()==uid: body=cand; break
                      try:
                          d=json.loads(cand); c2=base64.b64decode(d["data"] if isinstance(d,dict) else d)
                          if hashlib.sha1(c2).hexdigest()==uid: body=c2
                      except Exception: pass
                  if body is not None: break
              if body is None:
                  failed.append(p); print("FAIL",p,file=sys.stderr); continue
              if len(body) > 95*1024*1024:
                  failed.append(p+" (too big: %d MB)"%(len(body)>>20)); continue
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              open(p,"wb").write(body); changed.append(p)
          print("CHANGED",len(changed)); print("\n".join(changed))
          print("FAILED",len(failed)); print("\n".join(failed))
          open("/tmp/changed.txt","w").write("\n".join(changed))
          PY
      - name: Commit
        run: |
          git config user.name "sync-from-live"; git config user.email "actions@github.com"
          [ -s /tmp/changed.txt ] || { echo "nothing to commit"; exit 0; }
          tr '\n' '\0' < /tmp/changed.txt | xargs -0 git add -f --
          git commit -qm "Sync source from live esp-websitetest production deployment" && git push
